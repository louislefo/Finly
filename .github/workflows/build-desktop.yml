name: Build Desktop App (Windows, macOS & Linux)

on:
  push:
    branches:
      - main
      - test-release
      - test-release*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            artifact_name: Finly-Windows
          - os: macos-latest
            artifact_name: Finly-macOS
          - os: ubuntu-22.04
            artifact_name: Finly-Linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: finly-app/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-37 \
            gir1.2-webkit2-4.0 \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev

      - name: Build Next.js Static Export
        working-directory: finly-app
        env:
          NEXT_OUTPUT_MODE: export
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install Python Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview[edgechromium]

      - name: Install Python Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview pyobjc-framework-WebKit pyobjc-framework-Cocoa

      - name: Install Python Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview[gtk] PyGObject

      - name: Build Windows Executables (Directory & Standalone)
        if: runner.os == 'Windows'
        run: |
          # 1. Build directory bundle for modern Inno Setup installer packaging
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "Finly" `
            --icon "finly-app/public/favicon.ico" `
            --paths "backend" `
            --add-data "finly-app/out;finly-app/out" `
            --add-data "backend/app;app" `
            --collect-all "fastapi" `
            --collect-all "starlette" `
            --collect-all "pydantic" `
            --collect-all "pydantic_settings" `
            --collect-all "sqlalchemy" `
            --collect-all "uvicorn" `
            --collect-all "webview" `
            --collect-all "apscheduler" `
            --collect-all "woob" `
            --collect-all "html2text" `
            --collect-all "lxml" `
            --copy-metadata "woob" `
            --exclude-module "tkinter" `
            --exclude-module "unittest" `
            --exclude-module "pydoc" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespans" `
            --hidden-import "uvicorn.lifespans.on" `
            --hidden-import "webview.platforms.winforms" `
            --hidden-import "webview.platforms.edgechromium" `
            desktop.py

          # 2. Build standalone portable onefile executable
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "Finly-Portable" `
            --icon "finly-app/public/favicon.ico" `
            --paths "backend" `
            --add-data "finly-app/out;finly-app/out" `
            --add-data "backend/app;app" `
            --collect-all "fastapi" `
            --collect-all "starlette" `
            --collect-all "pydantic" `
            --collect-all "pydantic_settings" `
            --collect-all "sqlalchemy" `
            --collect-all "uvicorn" `
            --collect-all "webview" `
            --collect-all "apscheduler" `
            --collect-all "woob" `
            --collect-all "html2text" `
            --collect-all "lxml" `
            --copy-metadata "woob" `
            --exclude-module "tkinter" `
            --exclude-module "unittest" `
            --exclude-module "pydoc" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespans" `
            --hidden-import "uvicorn.lifespans.on" `
            --hidden-import "webview.platforms.winforms" `
            --hidden-import "webview.platforms.edgechromium" `
            desktop.py

      - name: Build Windows Modern Setup Installer (Inno Setup)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc installer.iss

      - name: Build macOS App Bundle and DMG
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --noconfirm \
            --onedir \
            --windowed \
            --name "Finly" \
            --icon "finly-app/public/icon-512.png" \
            --paths "backend" \
            --add-data "finly-app/out:finly-app/out" \
            --add-data "backend/app:app" \
            --collect-all "fastapi" \
            --collect-all "starlette" \
            --collect-all "pydantic" \
            --collect-all "pydantic_settings" \
            --collect-all "sqlalchemy" \
            --collect-all "uvicorn" \
            --collect-all "webview" \
            --collect-all "apscheduler" \
            --collect-all "woob" \
            --collect-all "html2text" \
            --collect-all "lxml" \
            --copy-metadata "woob" \
            --exclude-module "tkinter" \
            --exclude-module "unittest" \
            --exclude-module "pydoc" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespans" \
            --hidden-import "uvicorn.lifespans.on" \
            --hidden-import "webview.platforms.cocoa" \
            desktop.py

          # 1. Create native macOS DMG disk image installer
          mkdir -p dist-dmg
          cp -R dist/Finly.app dist-dmg/
          ln -s /Applications dist-dmg/Applications
          hdiutil create -volname "Finly" -srcfolder dist-dmg -ov -format UDZO dist/Finly-macOS.dmg

          # 2. Create ZIP archive
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Finly.app Finly-macOS.zip

      - name: Build Linux Binary and Packages
        if: runner.os == 'Linux'
        run: |
          pyinstaller \
            --noconfirm \
            --onefile \
            --windowed \
            --name "Finly-Linux-x86_64" \
            --paths "backend" \
            --add-data "finly-app/out:finly-app/out" \
            --add-data "backend/app:app" \
            --collect-all "fastapi" \
            --collect-all "starlette" \
            --collect-all "pydantic" \
            --collect-all "pydantic_settings" \
            --collect-all "sqlalchemy" \
            --collect-all "uvicorn" \
            --collect-all "webview" \
            --collect-all "apscheduler" \
            --collect-all "woob" \
            --collect-all "html2text" \
            --collect-all "lxml" \
            --copy-metadata "woob" \
            --exclude-module "tkinter" \
            --exclude-module "unittest" \
            --exclude-module "pydoc" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespans" \
            --hidden-import "uvicorn.lifespans.on" \
            --hidden-import "webview.platforms.gtk" \
            desktop.py

          # 1. Create portable tar.gz archive
          tar -czvf dist/Finly-Linux-x86_64.tar.gz -C dist Finly-Linux-x86_64

          # 2. Build .deb installer package
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/bin
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p deb-pkg/usr/share/icons/hicolor/512x512/apps

          cp dist/Finly-Linux-x86_64 deb-pkg/usr/bin/finly
          chmod +x deb-pkg/usr/bin/finly
          cp finly-app/public/icon-512.png deb-pkg/usr/share/icons/hicolor/512x512/apps/finly.png

          cat <<EOF > deb-pkg/DEBIAN/control
          Package: finly
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Finly <https://github.com/louislefo/Finly>
          Description: Finly Desktop - Personal Finance and Wealth Management Dashboard
          EOF

          cat <<EOF > deb-pkg/usr/share/applications/finly.desktop
          [Desktop Entry]
          Name=Finly
          Comment=Personal Finance and Wealth Management Dashboard
          Exec=/usr/bin/finly
          Icon=finly
          Terminal=false
          Type=Application
          Categories=Office;Finance;
          EOF

          dpkg-deb --build deb-pkg dist/Finly-Linux-amd64.deb

      - name: Upload Artifact (Windows Setup Installer)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-Windows-Setup
          path: dist-installer/Finly-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (Windows Portable)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-Windows-Portable
          path: dist/Finly-Portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (macOS DMG)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-macOS-DMG
          path: dist/Finly-macOS.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (macOS ZIP)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-macOS-ZIP
          path: dist/Finly-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (Linux DEB)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-Linux-DEB
          path: dist/Finly-Linux-amd64.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (Linux Tarball)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-Linux-Tarball
          path: dist/Finly-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-Windows-Setup
          path: release-binaries

      - name: Download Windows Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-Windows-Portable
          path: release-binaries

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-macOS-DMG
          path: release-binaries

      - name: Download macOS ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-macOS-ZIP
          path: release-binaries

      - name: Download Linux DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-Linux-DEB
          path: release-binaries

      - name: Download Linux Tarball Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-Linux-Tarball
          path: release-binaries

      - name: Publish Official Main Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Finly Desktop v1.0.${{ github.run_number }} (Latest Release)"
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-binaries/Finly-Setup.exe
            release-binaries/Finly-Portable.exe
            release-binaries/Finly-macOS.dmg
            release-binaries/Finly-macOS.zip
            release-binaries/Finly-Linux-amd64.deb
            release-binaries/Finly-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Test Preview Release
        if: github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-preview
          name: "Finly Desktop Test Preview (Build #${{ github.run_number }})"
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: false
          files: |
            release-binaries/Finly-Setup.exe
            release-binaries/Finly-Portable.exe
            release-binaries/Finly-macOS.dmg
            release-binaries/Finly-macOS.zip
            release-binaries/Finly-Linux-amd64.deb
            release-binaries/Finly-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

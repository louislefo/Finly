name: Build Desktop App (Windows & macOS)

on:
  push:
    branches:
      - main
      - test-release
      - test-release*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: Finly-Windows-x64
            output_file: dist/Finly.exe
          - os: macos-latest
            artifact_name: Finly-macOS-Universal
            output_file: dist/Finly.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: finly-app/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Build Next.js Static Export
        working-directory: finly-app
        env:
          NEXT_OUTPUT_MODE: export
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install Python Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview[edgechromium]

      - name: Install Python Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview pyobjc-framework-WebKit pyobjc-framework-Cocoa

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "Finly" `
            --icon "finly-app/public/favicon.ico" `
            --paths "backend" `
            --add-data "finly-app/out;finly-app/out" `
            --add-data "backend/app;app" `
            --collect-all "fastapi" `
            --collect-all "starlette" `
            --collect-all "pydantic" `
            --collect-all "pydantic_settings" `
            --collect-all "sqlalchemy" `
            --collect-all "uvicorn" `
            --collect-all "webview" `
            --collect-all "apscheduler" `
            --collect-all "woob" `
            --collect-all "html2text" `
            --collect-all "lxml" `
            --copy-metadata "woob" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespans" `
            --hidden-import "uvicorn.lifespans.on" `
            --hidden-import "webview.platforms.winforms" `
            --hidden-import "webview.platforms.edgechromium" `
            desktop.py

      - name: Build macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --noconfirm \
            --onedir \
            --windowed \
            --name "Finly" \
            --icon "finly-app/public/icon-512.png" \
            --paths "backend" \
            --add-data "finly-app/out:finly-app/out" \
            --add-data "backend/app:app" \
            --collect-all "fastapi" \
            --collect-all "starlette" \
            --collect-all "pydantic" \
            --collect-all "pydantic_settings" \
            --collect-all "sqlalchemy" \
            --collect-all "uvicorn" \
            --collect-all "webview" \
            --collect-all "apscheduler" \
            --collect-all "woob" \
            --collect-all "html2text" \
            --collect-all "lxml" \
            --copy-metadata "woob" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespans" \
            --hidden-import "uvicorn.lifespans.on" \
            --hidden-import "webview.platforms.cocoa" \
            desktop.py

      - name: Create ZIP archive for macOS App
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Finly.app Finly-macOS.zip

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-Windows-x64
          path: dist/Finly.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Finly-macOS-App
          path: dist/Finly-macOS.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-Windows-x64
          path: release-binaries

      - name: Download macOS App Artifact
        uses: actions/download-artifact@v4
        with:
          name: Finly-macOS-App
          path: release-binaries

      - name: Publish Official Main Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Finly Desktop v1.0.${{ github.run_number }} (Latest Release)"
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-binaries/Finly.exe
            release-binaries/Finly-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Test Preview Release
        if: github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-preview
          name: "Finly Desktop Test Preview (Build #${{ github.run_number }})"
          generate_release_notes: true
          draft: false
          prerelease: true
          make_latest: false
          files: |
            release-binaries/Finly.exe
            release-binaries/Finly-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

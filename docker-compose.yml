version: '3.8'

services:
  finly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finly
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - finly_data:/app/data
      - finly_woob:/app/woob_data
    environment:
      - DATABASE_URL=sqlite:///./data/finly.db
      - SYNC_INTERVAL_HOURS=6
      - CORS_ORIGINS=*
      - SECRET_KEY=${SECRET_KEY:-finly-default-secret-key-change-me-in-prod}
      - BACKEND_INTERNAL_URL=http://127.0.0.1:8000
      - NEXT_PUBLIC_API_URL=/api/v1
      - PORT=3000
      - HOSTNAME=0.0.0.0

volumes:
  finly_data:
    driver: local
  finly_woob:
    driver: local

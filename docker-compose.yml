version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finly-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - finly_data:/app/data
      - finly_woob:/app/woob_data
    environment:
      - DATABASE_URL=sqlite:///./data/finly.db
      - SYNC_INTERVAL_HOURS=6
      - CORS_ORIGINS=http://localhost:3000

  frontend:
    build:
      context: ./finly-app
      dockerfile: Dockerfile
    container_name: finly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  finly_data:
    driver: local
  finly_woob:
    driver: local

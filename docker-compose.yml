version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finly-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - finly_data:/app/data
      - finly_woob:/app/woob_data
    environment:
      - DATABASE_URL=sqlite:///./data/finly.db
      - SYNC_INTERVAL_HOURS=6
      - CORS_ORIGINS=*
      - SECRET_KEY=${SECRET_KEY:-finly-default-secret-key-change-me-in-prod}

  frontend:
    build:
      context: ./finly-app
      dockerfile: Dockerfile
    container_name: finly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  finly_data:
    driver: local
  finly_woob:
    driver: local
